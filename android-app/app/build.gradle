plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tendo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tendo.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def tendoWebAssets = layout.buildDirectory.dir("generated/tendoWebAssets")

tasks.register("stageTendoWebAssets", Copy) {
    from(rootProject.projectDir.parentFile) {
        include "index.html", "styles.css", "app.js"
    }
    into(tendoWebAssets)
}

android.sourceSets.main.assets.srcDir(tendoWebAssets)

tasks.named("preBuild").configure {
    dependsOn("stageTendoWebAssets")
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}
